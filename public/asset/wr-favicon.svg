<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="wrFaviconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a36"/>
      <stop offset="100%" stop-color="#090d1f"/>
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded corners and theme stroke -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#wrFaviconBg)" stroke="#ff3b30" stroke-width="2.5" stroke-opacity="0.85"/>
  <!-- WR Monogram with high readability bold typography -->
  <text x="32" y="44" font-family="'Urbanist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="900" letter-spacing="-1.5px" text-anchor="middle">
    <tspan fill="#ff3b30">W</tspan><tspan fill="#ffffff">R</tspan>
  </text>
</svg>
